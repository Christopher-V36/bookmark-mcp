<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Log in · bookmark-mcp</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="login-page">
    <main class="login">
      <p class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z" /></svg>
        <span>bookmark-mcp</span>
      </p>
      <h1 class="page-title">Open your saved posts on this device</h1>
      <p class="lede">
        Scan the QR code shown in the app on your computer, under <b>Use on your phone</b>.
        Or type the code shown there.
      </p>
      <form method="get" action="/login" class="login-form">
        <label class="field">
          <span>Code</span>
          <input class="text-input" name="code" autocomplete="one-time-code" autocapitalize="off"
                 spellcheck="false" required />
        </label>
        <p class="error" hidden data-error>That code didn't match. Check it on your computer and try again.</p>
        <button class="button" type="submit">Log in</button>
      </form>
      <p class="section-hint">This device stays logged in for 30 days.</p>
    </main>
  </body>
</html>
