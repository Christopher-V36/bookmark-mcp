[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookmark-mcp"
version = "0.1.0"
description = "Let your AI research the posts you saved (X first, more platforms later) - locally, for free, images included."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Christopher-V36" }]
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "Pillow>=10.4",
    "platformdirs>=4.2",
    "click>=8.1",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bookmark-mcp = "bookmark_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bookmark_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
