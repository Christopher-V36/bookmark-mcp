<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Log in · bookmark-mcp</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#14302b" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="login-page">
    <main class="login">
      <p class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z" /></svg>
        <span>bookmark-mcp</span>
      </p>
      <h1 class="page-title">Log in to your saved posts</h1>
      <form method="post" action="/login" class="login-form">
        <label class="field">
          <span>Email</span>
          <input class="text-input" type="email" name="email" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input class="text-input" type="password" name="password" autocomplete="current-password" required />
        </label>
        <p class="error" hidden data-error>Wrong email or password.</p>
        <button class="button" type="submit">Log in</button>
      </form>
      <p class="section-hint">Forgot it? Set a new one on your computer with <b>bookmark-mcp cloud password</b>.</p>
    </main>
  </body>
</html>
