# Copied to wrangler.toml by `bookmark-mcp cloud deploy` with your own D1 database id.
name = "bookmark-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/api/*", "/media/*", "/login", "/logout", "/sync/*"]

[[d1_databases]]
binding = "DB"
database_name = "bookmark-mcp"
database_id = "__DATABASE_ID__"
