<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bookmark-mcp</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>bookmark-mcp</h1>
      <span id="connection" class="pill">Checking…</span>
    </header>
    <p id="connection-detail" class="muted"></p>

    <section>
      <h2>Load this page</h2>
      <p id="scroll-status" class="muted"></p>
      <div class="row">
        <button id="scroll-new" title="Scroll until posts you already saved appear">Load new</button>
        <button id="scroll-all" class="secondary" title="Scroll to the very end">Load all</button>
        <button id="scroll-stop" class="secondary">Stop</button>
      </div>
    </section>

    <section>
      <h2>Activity</h2>
      <dl class="stats">
        <div><dt>Captured</dt><dd id="captured">0</dd></div>
        <div><dt>Delivered</dt><dd id="sent">0</dd></div>
        <div><dt>Waiting</dt><dd id="queued">0</dd></div>
      </dl>
      <p id="last-error" class="error" hidden></p>
      <button id="retry" class="secondary">Retry now</button>
    </section>

    <section>
      <h2>Capture</h2>
      <div id="toggles" class="toggles"></div>
    </section>

    <section>
      <h2>Pairing</h2>
      <label class="field">App address<input id="server-url" type="url" spellcheck="false" /></label>
      <label class="field"
        >Pairing token <span class="muted">(run <code>bookmark-mcp token</code>)</span>
        <input id="token" type="password" spellcheck="false" autocomplete="off"
      /></label>
      <button id="save">Save &amp; test</button>
    </section>

    <footer class="muted">Only reads what x.com already shows you. Nothing leaves your computer.</footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
